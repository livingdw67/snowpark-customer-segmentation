name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the stored procedures' RUNTIME_VERSION
          cache: pip
      - run: pip install -r requirements.txt -r requirements-assistant.txt
      - run: pytest tests -q
